<!DOCTYPE html>
<html lang="id" data-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Telusur Mutu KNMP - Sistem CRUD & Role Switcher</title>
    <!-- Tailwind CSS for modern responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef8fb',
                            100: '#d5edf3',
                            500: '#0b6e8a',
                            600: '#09576d',
                            700: '#074252'
                        }
                    }
                }
            }
        }
    </script>
    <!-- QRCode Generator Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>

<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

    <!-- TOP HEADER WITH ROLE SWITCHER & THEME TOGGLE -->
    <header class="sticky top-0 z-50 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
            
            <!-- App Branding -->
           

            <!-- Role Switcher & Controls -->
            <div class="flex items-center gap-2 ml-auto">
                <!-- Role Toggle Button -->
               

                <!-- Theme Toggle Button -->
                <button onclick="toggleTheme()" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition" title="Ganti Tema">
                    <i id="themeIcon" class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- NOTIFICATION / TOAST CONTAINER -->
    <div id="toastContainer" class="fixed top-20 right-4 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full px-4"></div>

    <!-- MAIN APP CONTAINER -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-6 pb-24 animate-fade-in" id="appContent">
        <!-- Content dynamically injected here -->
    </main>

    <!-- BOTTOM NAVIGATION (ADMIN VIEW) -->
    <nav id="bottomNav" class="fixed bottom-0 left-0 right-0 z-40 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 shadow-lg pb-[env(safe-area-inset-bottom,0px)]">
        <div class="max-w-4xl mx-auto flex justify-around">
            <a href="#/" id="navDash" onclick="setRoute('#/')" class="flex-1 flex flex-col items-center py-3 text-slate-500 dark:text-slate-400 hover:text-brand-600 dark:hover:text-brand-400 transition text-xs font-medium">
                <i class="fa-solid fa-chart-pie text-lg mb-1"></i>
                <span>Dasbor</span>
            </a>
            <a href="#/baru" id="navNew" onclick="setRoute('#/baru')" class="flex-1 flex flex-col items-center py-3 text-slate-500 dark:text-slate-400 hover:text-brand-600 dark:hover:text-brand-400 transition text-xs font-medium">
                <i class="fa-solid fa-circle-plus text-lg mb-1"></i>
                <span>+ Batch</span>
            </a>
            <a href="#/cari" id="navSearch" onclick="setRoute('#/cari')" class="flex-1 flex flex-col items-center py-3 text-slate-500 dark:text-slate-400 hover:text-brand-600 dark:hover:text-brand-400 transition text-xs font-medium">
                <i class="fa-solid fa-magnifying-glass text-lg mb-1"></i>
                <span>Lacak</span>
            </a>
        </div>
    </nav>

    <!-- JAVASCRIPT APPLICATION CORE -->
    <script>
        const STORAGE_KEY = "knmp_batches_v2";
        const MAX_HOURS = 12;
        const MAX_TEMP = 4;
        
        // Application State
        let batches = [];
        let currentRole = "admin"; // "admin" or "customer"
        let currentTheme = localStorage.getItem("knmp_theme") || "light";

        // Initial Seed Data for demonstration
        function getSeedData() {
            const now = Date.now();
            const iso = (hoursAgo) => new Date(now - hoursAgo * 3600000).toISOString().slice(0, 16);
            return [
                {
                    id: "KNMP-LOK-20261001-001",
                    jenis: "Ikan Tongkol Segar",
                    kapal: "KM Sinar Laut",
                    nelayan: "Pak Darman",
                    zona: "WPP-713, 5 mil",
                    alat: "Pancing Ulur",
                    tTangkap: iso(30),
                    tDarat: iso(24),
                    berat: 120,
                    suhuPalka: 2.0,
                    es: 60,
                    skor: 8,
                    suhuIkan: 2.5,
                    grade: "A",
                    histamin: "1.2",
                    flag: false,
                    cold: { suhu: 1.5, batch: "CS-17", tgl: iso(22).slice(0, 10) },
                    dist: { kend: "Truk Berpendingin B 1234 XY", suhu: 3.0, tujuan: "Pasar Induk Ikan" },
                    jual: { pembeli: "Koperasi Nelayan Sejahtera" }
                },
                {
                    id: "KNMP-LOK-20261005-001",
                    jenis: "Ikan Cakalang",
                    kapal: "KM Bahari 2",
                    nelayan: "Pak Laode",
                    zona: "WPP-713, 8 mil",
                    alat: "Jaring Lingkar",
                    tTangkap: iso(9),
                    tDarat: iso(2),
                    berat: 200,
                    suhuPalka: 7.0,
                    es: 40,
                    skor: 6,
                    suhuIkan: 6.5,
                    grade: "B",
                    histamin: "3.5",
                    flag: false
                },
                {
                    id: "KNMP-LOK-20261005-002",
                    jenis: "Ikan Kembung Banjar",
                    kapal: "KM Sinar Laut",
                    nelayan: "Pak Darman",
                    zona: "WPP-713, 3 mil",
                    alat: "Gill Net",
                    tTangkap: iso(8),
                    tDarat: iso(4),
                    berat: 80,
                    suhuPalka: 2.0,
                    es: 50,
                    skor: 8,
                    suhuIkan: 2.0,
                    grade: "A",
                    histamin: "0.8",
                    flag: false,
                    cold: { suhu: 1.0, batch: "CS-19", tgl: iso(3).slice(0, 10) }
                }
            ];
        }

        function initTheme() {
            if (currentTheme === "dark") {
                document.documentElement.classList.add("dark");
                document.getElementById("themeIcon").className = "fa-solid fa-sun";
            } else {
                document.documentElement.classList.remove("dark");
                document.getElementById("themeIcon").className = "fa-solid fa-moon";
            }
        }

        function toggleTheme() {
            currentTheme = currentTheme === "light" ? "dark" : "light";
            localStorage.setItem("knmp_theme", currentTheme);
            initTheme();
        }

        function loadData() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) {
                    batches = JSON.parse(data);
                } else {
                    batches = getSeedData();
                    saveData();
                }
            } catch (e) {
                batches = getSeedData();
            }
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(batches));
            } catch (e) {
                showToast("Gagal menyimpan data ke penyimpanan lokal.", "error");
            }
        }

        function showToast(message, type = "success") {
            const container = document.getElementById("toastContainer");
            const toast = document.createElement("div");
            const bgClass = type === "error" ? "bg-red-600 text-white" : "bg-emerald-600 text-white";
            toast.className = `${bgClass} px-4 py-3 rounded-xl shadow-lg text-sm font-medium flex items-center justify-between gap-3 pointer-events-auto transition transform translate-y-2 opacity-0`;
            toast.innerHTML = `<span>${message}</span><i class="fa-solid fa-xmark cursor-pointer" onclick="this.parentElement.remove()"></i>`;
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove("translate-y-2", "opacity-0");
            }, 10);

            setTimeout(() => {
                toast.classList.add("translate-y-2", "opacity-0");
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function toggleRole() {
            currentRole = currentRole === "admin" ? "customer" : "admin";
            updateRoleUI();
            
            // If switching to customer, redirect to customer landing or public search view
            if (currentRole === "customer") {
                document.getElementById("bottomNav").style.display = "none";
                if (batches.length > 0) {
                    location.hash = "#/k/" + batches[0].id;
                } else {
                    location.hash = "#/k/empty";
                }
            } else {
                document.getElementById("bottomNav").style.display = "block";
                location.hash = "#/";
            }
            showToast(`Beralih ke Mode ${currentRole === "admin" ? "Admin (Petugas)" : "Pelanggan (Konsumen)"}`);
        }

        function updateRoleUI() {
            const badge = document.getElementById("roleBadgeText");
            const btnLabel = document.getElementById("roleSwitcherLabel");
            const btnIcon = document.getElementById("roleSwitcherIcon");
            
            if (currentRole === "admin") {
                badge.textContent = "Mode: Admin (Petugas)";
                badge.className = "text-xs font-semibold px-2 py-0.5 rounded-full bg-brand-50 text-brand-700 dark:bg-brand-950 dark:text-brand-300";
                btnLabel.textContent = "Beralih ke Pelanggan";
                btnIcon.className = "fa-solid fa-user-shield";
                document.getElementById("bottomNav").style.display = "block";
            } else {
                badge.textContent = "Mode: Pelanggan (Konsumen)";
                badge.className = "text-xs font-semibold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300";
                btnLabel.textContent = "Beralih ke Admin";
                btnIcon.className = "fa-solid fa-user";
                document.getElementById("bottomNav").style.display = "none";
            }
        }

        function calculateHours(batch) {
            return (new Date(batch.tDarat) - new Date(batch.tTangkap)) / 3600000;
        }

        function getAlerts(batch) {
            let alerts = [];
            const hours = calculateHours(batch);
            if (batch.flag) alerts.push("Ditandai bermasalah / Recall");
            if (batch.skor < 5) alerts.push(`Skor organoleptik rendah (${batch.skor}/9)`);
            if (batch.suhuIkan > MAX_TEMP) alerts.push(`Suhu ikan tinggi (${batch.suhuIkan}°C > ${MAX_TEMP}°C)`);
            if (batch.suhuPalka > MAX_TEMP) alerts.push(`Suhu palka tinggi (${batch.suhuPalka}°C > ${MAX_TEMP}°C)`);
            if (hours > MAX_HOURS) alerts.push(`Durasi tangkap-darat lama (${hours.toFixed(1)} jam > ${MAX_HOURS} jam)`);
            if (batch.cold && batch.cold.suhu > MAX_TEMP) alerts.push(`Suhu cold storage tinggi (${batch.cold.suhu}°C)`);
            if (batch.dist && batch.dist.suhu > MAX_TEMP) alerts.push(`Suhu distribusi tinggi (${batch.dist.suhu}°C)`);
            return alerts;
        }

        function getBatchStatus(batch) {
            const alerts = getAlerts(batch);
            if (batch.flag || batch.skor < 5) return "bad";
            if (alerts.length > 0) return "warn";
            return "baik";
        }

        const StatusLabels = {
            baik: { text: "Lolos Uji Mutu", class: "bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800" },
            warn: { text: "Peringatan Mutu", class: "bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300 border border-amber-200 dark:border-amber-800" },
            bad: { text: "Ditahan / Reject", class: "bg-red-100 text-red-800 dark:bg-red-950 dark:text-red-300 border border-red-200 dark:border-red-800" }
        };

        function renderBadge(batch) {
            const status = getBatchStatus(batch);
            const info = StatusLabels[status];
            return `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold ${info.class}">${info.text}</span>`;
        }

        function getStageText(batch) {
            if (batch.jual) return "Sudah Dijual / Konsumen";
            if (batch.dist) return "Dalam Distribusi";
            if (batch.cold) return "Cold Storage (Penyimpanan)";
            return "Pendaratan Dermaga";
        }

        function formatDateTime(isoStr) {
            if (!isoStr) return "-";
            return new Date(isoStr).toLocaleString("id-ID", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
        }

        function findBatchById(id) {
            return batches.find(b => b.id === id);
        }

        function setRoute(hash) {
            location.hash = hash;
        }

        function renderDashboard() {
            let lolos = 0, warning = 0, ditahan = 0;
            let activeAlerts = [];

            batches.forEach(b => {
                const st = getBatchStatus(b);
                if (st === "baik") lolos++;
                else if (st === "warn") warning++;
                else ditahan++;

                getAlerts(b).forEach(msg => {
                    activeAlerts.push({ id: b.id, jenis: b.jenis, msg });
                });
            });

            let html = `
                <div class="space-y-6">
                    <!-- Top Overview Cards -->
                    <div>
                        <h2 class="text-xl font-bold tracking-tight">Dasbor Pengawasan Mutu KNMP</h2>
                        <p class="text-sm text-slate-500 dark:text-slate-400">Monitoring rantai pasok dan kelayakan mutu ikan segar dari nelayan.</p>
                    </div>

                    <div class="grid grid-cols-3 gap-3">
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 rounded-2xl shadow-sm text-center">
                            <span class="text-2xl lg:text-3xl font-extrabold text-emerald-600 dark:text-emerald-400">${lolos}</span>
                            <span class="block text-xs font-medium text-slate-500 dark:text-slate-400 mt-1">Lolos Mutu</span>
                        </div>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 rounded-2xl shadow-sm text-center">
                            <span class="text-2xl lg:text-3xl font-extrabold text-amber-600 dark:text-amber-400">${warning}</span>
                            <span class="block text-xs font-medium text-slate-500 dark:text-slate-400 mt-1">Peringatan</span>
                        </div>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 rounded-2xl shadow-sm text-center">
                            <span class="text-2xl lg:text-3xl font-extrabold text-red-600 dark:text-red-400">${ditahan}</span>
                            <span class="block text-xs font-medium text-slate-500 dark:text-slate-400 mt-1">Ditahan</span>
                        </div>
                    </div>

                    <!-- Active Alerts Box -->
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm">
                        <div class="flex items-center justify-between mb-3">
                            <h3 class="font-semibold text-sm flex items-center gap-2">
                                <i class="fa-solid fa-triangle-exclamation text-amber-500"></i> Peringatan Sistem (${activeAlerts.length})
                            </h3>
                        </div>
                        <div class="space-y-2 max-h-48 overflow-y-auto pr-1">
                            ${activeAlerts.length === 0 ? '<p class="text-xs text-slate-400">Tidak ada peringatan aktif saat ini.</p>' : 
                                activeAlerts.map(a => `
                                    <div onclick="location.hash='#/b/${a.id}'" class="p-2.5 rounded-xl bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-900/50 cursor-pointer hover:opacity-80 transition text-xs flex justify-between items-center">
                                        <div>
                                            <span class="font-bold text-slate-700 dark:text-slate-200">${a.id} (${a.jenis})</span>
                                            <p class="text-amber-700 dark:text-amber-400 mt-0.5">${a.msg}</p>
                                        </div>
                                        <i class="fa-solid fa-chevron-right text-amber-500 text-xs"></i>
                                    </div>
                                `).join('')}
                        </div>
                    </div>

                    <!-- Batch List -->
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <h3 class="font-semibold text-base">Daftar Seluruh Batch (${batches.length})</h3>
                            <div class="flex gap-2">
                                <button onclick="exportCSV()" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-300 transition flex items-center gap-1.5">
                                    <i class="fa-solid fa-download"></i> Ekspor CSV
                                </button>
                                <button onclick="location.hash='#/baru'" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-brand-600 text-white hover:bg-brand-700 transition flex items-center gap-1.5 shadow-sm">
                                    <i class="fa-solid fa-plus"></i> Tambah Batch
                                </button>
                            </div>
                        </div>

                        <div class="space-y-3">
                            ${batches.length === 0 ? `
                                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-8 text-center">
                                    <i class="fa-solid fa-box-open text-3xl text-slate-300 mb-2"></i>
                                    <p class="text-sm text-slate-500">Belum ada data batch ikan tercatat.</p>
                                </div>
                            ` : batches.slice().reverse().map(b => `
                                <div onclick="location.hash='#/b/${b.id}'" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm cursor-pointer hover:border-brand-500 transition flex items-center justify-between gap-4">
                                    <div class="space-y-1">
                                        <div class="flex items-center gap-2 flex-wrap">
                                            <span class="font-bold text-sm">${b.jenis}</span>
                                            <span class="text-xs text-slate-400">• ${b.berat} kg</span>
                                            ${renderBadge(b)}
                                        </div>
                                        <div class="text-xs text-slate-500 dark:text-slate-400 font-mono">${b.id}</div>
                                        <div class="text-xs text-slate-600 dark:text-slate-300 flex items-center gap-2">
                                            <span><i class="fa-solid fa-ship mr-1"></i>${b.kapal}</span>
                                            <span>•</span>
                                            <span><i class="fa-solid fa-location-dot mr-1"></i>${getStageText(b)}</span>
                                        </div>
                                    </div>
                                    <i class="fa-solid fa-chevron-right text-slate-400 text-sm"></i>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
            document.getElementById("appContent").innerHTML = html;
        }

        function renderNewBatchForm() {
            const nowIso = new Date().toISOString().slice(0, 16);
            const defaultLoc = " ";
            let html = `
                <div class="space-y-6">
                    <div>
                        <h2 class="text-xl font-bold tracking-tight">Tambah Batch Ikan Baru</h2>
                        <p class="text-sm text-slate-500 dark:text-slate-400">Lengkapi formulir multi-tahap penangkapan dan pendaratan mutu ikan.</p>
                    </div>

                    <form id="newBatchForm" onsubmit="handleCreateBatch(event)" class="space-y-4">
                        <!-- Tahap 1: Penangkapan -->
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 rounded-2xl shadow-sm space-y-3">
                            <h3 class="font-bold text-sm text-brand-600 dark:text-brand-400 flex items-center gap-2">
                                <i class="fa-solid fa-anchor"></i> 1. Informasi Penangkapan
                            </h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-medium text-slate-500 mb-1">Kode Lokasi/Pelabuhan</label>
                                    <input type="text" id="inputLoc" required value="${defaultLoc}" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:border-brand-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-500 mb-1">Jenis Ikan</label>
                                    <input type="text" id="inputJenis" required placeholder="Contoh: Ikan Tongkol" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:border-brand-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-500 mb-1">Nama Kapal</label>
                                    <input type="text" id="inputKapal" required placeholder="Contoh: KM Sinar Laut" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:border-brand-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-500 mb-1">Nama Nelayan / Nakhoda</label>
                                    <input type="text" id="inputNelayan" required placeholder="Contoh: Pak Darman" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:border-brand-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-500 mb-1">Zona Tangkap / Koordinat</label>
                                    <input type="text" id="inputZona" required placeholder="Contoh: WPP-713, 5 mil" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:border-brand-500">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-500 mb-1">Alat Tangkap</label>
                                    <select id="inputAlat" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:border-brand-500">
                                        <option>Pancing Ulur</option>
                                        <option>Jaring Lingkar</option>
                                        <option>Gill Net</option>
                                        <option>Pukat Cincin</option>
                                        <option>Bubu</option>
                                    </select>
                                </div>
                                <div class="sm:col-span-2">
                                    <label class="block text-xs font-medium text-slate-500 mb-1">Waktu Tangkap</label>
                                    <input type="datetime-local" id="inputTTangkap" required value="${new Date(Date.now() - 6*3600000).toISOString().slice(0,16)}" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:border-brand-500">
                                </div>
                            </div>
                        </div>

                        <!-- Tahap 2: Penanganan di Kapal -->
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 rounded-2xl shadow-sm space-y-3">
                            <h3 class="font-bold text-sm text-brand-600 dark:text-brand-400 flex items-center gap-2">
                                <i class="fa-solid fa-temperature-low"></i> 2. Penanganan di Kapal
                            </h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-medium text-slate-500 mb-1">Suhu Palka (°C)</label>

        function handleCreateBatch(e) {
            e.preventDefault();
            const loc = document.getElementById("inputLoc").value.trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
            const dateStr = document.getElementById("inputTTangkap").value.slice(0, 10).replace(/-/g, "");
            const prefix = `KNMP-${loc || "LOK"}-${dateStr}-`;
            const count = batches.filter(b => b.id.startsWith(prefix)).length + 1;
            const id = prefix + String(count).padStart(3, '0');

            const skorVal = parseInt(document.getElementById("inputSkor").value);
            if (skorVal < 1 || skorVal > 9) {
                showToast("Skor organoleptik harus di antara 1 dan 9.", "error");
                return;
            }

            const newBatch = {
                id,
                jenis: document.getElementById("inputJenis").value,
                kapal: document.getElementById("inputKapal").value,
                nelayan: document.getElementById("inputNelayan").value,
                zona: document.getElementById("inputZona").value,
                alat: document.getElementById("inputAlat").value,
                tTangkap: document.getElementById("inputTTangkap").value,
                tDarat: document.getElementById("inputTDarat").value,
                berat: parseFloat(document.getElementById("inputBerat").value),
                suhuPalka: parseFloat(document.getElementById("inputSuhuPalka").value),
                es: parseFloat(document.getElementById("inputEs").value),
                skor: skorVal,
                suhuIkan: parseFloat(document.getElementById("inputSuhuIkan").value),
                grade: document.getElementById("inputGrade").value.charAt(0),
                histamin: document.getElementById("inputHistamin").value,
                flag: false
            };

            batches.push(newBatch);
            saveData();
            showToast("Batch berhasil ditambahkan!");
            location.hash = "#/b/" + id;
        }

        function generateQRCode(id) {
            const container = document.getElementById("qrContainer");
            if (!container) return;
            try {
                const qrUrl = window.location.href.split("#")[0] + "#/k/" + id;
                const qr = qrcode(0, 'M');
                qr.addData(qrUrl);
                qr.make();
                container.innerHTML = qr.createSvgTag(5);
            } catch (e) {
                container.innerHTML = `<span class="text-xs text-red-500">Gagal membuat QR</span>`;
            }
        }

        function addStage(id, type) {
            const b = findBatchById(id);
            if (!b) return;

            if (type === 'cold') {
                const suhu = parseFloat(document.getElementById("csSuhu").value);
                const batchNum = document.getElementById("csBatch").value.trim();
                if (isNaN(suhu) || !batchNum) {
                    showToast("Lengkapi data cold storage dengan benar.", "error");
                    return;
                }
                b.cold = { suhu, batch: batchNum, tgl: new Date().toISOString().slice(0, 10) };
            } else if (type === 'dist') {
                const kend = document.getElementById("distKend").value.trim();
                const suhu = parseFloat(document.getElementById("distSuhu").value);
                const tujuan = document.getElementById("distTujuan").value.trim();
                if (!kend || isNaN(suhu) || !tujuan) {
                    showToast("Lengkapi data distribusi dengan benar.", "error");
                    return;
                }
                b.dist = { kend, suhu, tujuan };
            } else if (type === 'jual') {
                const pembeli = document.getElementById("jualPembeli").value.trim();
                if (!pembeli) {
                    showToast("Masukkan nama pembeli/koperasi.", "error");
                    return;
                }
                b.jual = { pembeli };
            }

            saveData();
            showToast("Tahap rantai pasok berhasil diperbarui!");
            renderBatchDetail(id);
        }

        function toggleFlag(id) {
            const b = findBatchById(id);
            if (!b) return;
            b.flag = !b.flag;
            saveData();
            showToast(b.flag ? "Batch ditandai bermasalah (Recall)." : "Tanda masalah dilepas.");
            renderBatchDetail(id);
        }

        function deleteBatch(id) {
            if (!confirm("Apakah Anda yakin ingin menghapus batch ini secara permanen?")) return;
            batches = batches.filter(b => b.id !== id);
            saveData();
            showToast("Batch berhasil dihapus.");
            location.hash = "#/";
        }

                        </div>
                        <div class="flex items-start gap-3">
                            <div class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center shrink-0 font-bold">3</div>
                            <div>
                                <strong class="block text-slate-800 dark:text-slate-200">Distribusi & Pasar</strong>
                                <span class="text-slate-500">${b.jual ? 'Telah disalurkan ke pembeli/koperasi: ' + b.jual.pembeli : b.dist ? 'Dalam perjalanan menuju ' + b.dist.tujuan : 'Dalam penyimpanan cold storage.'}</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="text-center pt-2">
                    <button onclick="toggleRole()" class="px-6 py-2.5 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-semibold text-xs hover:bg-slate-300 transition">
                        Beralih Kembali ke Mode Admin
                    </button>
                </div>
            </div>
            `;

            document.getElementById("appContent").innerHTML = html;
        }

        function renderSearch() {
            let html = `
                <div class="space-y-6">
                    <div>
                        <h2 class="text-xl font-bold tracking-tight">Lacak Batch Ikan</h2>
                        <p class="text-sm text-slate-500 dark:text-slate-400">Cari berdasarkan ID batch, jenis ikan, nama kapal, atau nelayan.</p>
                    </div>

                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 rounded-2xl shadow-sm">
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400"></i>
                            <input type="text" id="searchInput" oninput="handleSearchInput()" placeholder="Ketik kata kunci pencarian..." class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:border-brand-500">
                        </div>
                    </div>

                    <div id="searchResults" class="space-y-3">
                        <div class="text-center py-8 text-slate-400 text-xs">Mulai ketik di atas untuk mencari data batch.</div>
                    </div>
                </div>
            `;
            document.getElementById("appContent").innerHTML = html;
        }

        function handleSearchInput() {
            const query = document.getElementById("searchInput").value.toLowerCase().trim();
            const container = document.getElementById("searchResults");
            
            if (!query) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs">Mulai ketik di atas untuk mencari data batch.</div>`;
                return;
            }

            const results = batches.filter(b => 
                b.id.toLowerCase().includes(query) ||
                b.jenis.toLowerCase().includes(query) ||
                b.kapal.toLowerCase().includes(query) ||
                b.nelayan.toLowerCase().includes(query)
            );

            if (results.length === 0) {
                container.innerHTML = `<div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 text-center text-slate-400 text-xs">Tidak ditemukan batch yang sesuai dengan kata kunci tersebut.</div>`;
                return;
            }

            container.innerHTML = results.map(b => `
                <div onclick="location.hash='#/b/${b.id}'" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm cursor-pointer hover:border-brand-500 transition flex items-center justify-between gap-4">
                    <div class="space-y-1">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-sm">${b.jenis}</span>
                            ${renderBadge(b)}
                        </div>
                        <div class="text-xs font-mono text-slate-400">${b.id}</div>
                        <div class="text-xs text-slate-600 dark:text-slate-300">Kapal: ${b.kapal} (${b.nelayan})</div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-slate-400 text-sm"></i>
                </div>
            `).join('');
        }

        function exportCSV() {
            let rows = [["ID", "Jenis Ikan", "Kapal", "Nelayan", "Zona Tangkap", "Waktu Tangkap", "Waktu Darat", "Berat (kg)", "Suhu Ikan (°C)", "Skor Organoleptik", "Grade", "Status Mutu", "Tahap Terakhir"]];
            batches.forEach(b => {
                rows.push([
                    b.id,
                    b.jenis,
                    b.kapal,
                    b.nelayan,
                    b.zona,
                    b.tTangkap,
                    b.tDarat,
                    b.berat,
                    b.suhuIkan,
                    b.skor,
                    b.grade,
                    StatusLabels[getBatchStatus(b)].text,
                    getStageText(b)
                ]);
            });

            const csvContent = rows.map(e => e.map(val => `"${String(val).replace(/"/g, '""')}"`).join(",")).join("\n");
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `rekap_mutu_knmp_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            showToast("Rekap CSV berhasil diunduh.");
        }

        function router() {
            const hash = location.hash || "#/";
            const parts = hash.split("/");

            // Highlight bottom nav items if in admin mode
            if (currentRole === "admin") {
                document.getElementById("navDash").className = `flex-1 flex flex-col items-center py-3 transition text-xs font-medium ${hash === '#/' ? 'text-brand-600 dark:text-brand-400' : 'text-slate-500 dark:text-slate-400'}`;
                document.getElementById("navNew").className = `flex-1 flex flex-col items-center py-3 transition text-xs font-medium ${hash === '#/baru' ? 'text-brand-600 dark:text-brand-400' : 'text-slate-500 dark:text-slate-400'}`;
                document.getElementById("navSearch").className = `flex-1 flex flex-col items-center py-3 transition text-xs font-medium ${hash === '#/cari' ? 'text-brand-600 dark:text-brand-400' : 'text-slate-500 dark:text-slate-400'}`;
            }

            if (parts[1] === "baru") {
                renderNewBatchForm();
            } else if (parts[1] === "cari") {
                renderSearch();
            } else if (parts[1] === "b") {
                renderBatchDetail(decodeURIComponent(parts[2]));
            } else if (parts[1] === "k") {
                renderCustomerView(decodeURIComponent(parts[2]));
            } else {
                if (currentRole === "customer") {
                    if (batches.length > 0) renderCustomerView(batches[0].id);
                    else renderCustomerView("");
                } else {
                    renderDashboard();
                }
            }
            window.scrollTo(0, 0);
        }

        window.addEventListener("hashchange", router);

        // Initial Boot
        window.onload = function() {
            initTheme();
            loadData();
            router();
        };
    </script>
</body>

</html>
